<!doctype html>
<html lang="es" dir="ltr">
<head dir="auto">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tienda SPA - Ejemplo IA</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="description" content="Tienda virtual de ejemplo — SPA con imágenes y prompts IA" />
</head>
<body dir="ltr">
  <header class="topbar">
    <div class="brand">MiTienda</div>
    <nav class="nav" aria-label="Navegación principal" dir="auto">
      <ul class="nav-list" dir="auto">
        <li>
          <button type="button" data-route="home" aria-label="Inicio" title="Inicio" class="icon-btn">🏠
            <span class="sr-only">Inicio</span>
          </button>
        </li>
        <li>
          <button type="button" data-route="map" aria-label="Mapa" title="Mapa" class="icon-btn">🗺️
            <span class="sr-only">Mapa</span>
          </button>
        </li>
        <li>
          <button type="button" data-route="shipping" aria-label="Envío y pago" title="Pago y envío" class="icon-btn">💳🚚
            <span class="sr-only">Pago y envío</span>
          </button>
        </li>
        <li>
          <button type="button" data-route="contact" aria-label="Contacto" title="Contacto" class="icon-btn">📞
            <span class="sr-only">Contacto</span>
          </button>
        </li>
        <li>
          <button type="button" data-route="cart" aria-label="Ver carrito" title="Carrito" class="icon-btn">🛒
            <span id="cart-count" class="badge">0</span>
            <span class="sr-only">Ver carrito</span>
          </button>
        </li>
      </ul>
    </nav>
  </header>

  <main id="app">
    <!-- Contenido renderizado por app.js -->
  </main>

  <footer class="footer">
    <small>MiTienda — Demo SPA · Imágenes: prompts IA (ver 
      <a href="prompts.txt" target="_blank" rel="noopener noreferrer">prompts.txt
        <span class="sr-only">(se abre en una pestaña nueva)</span>
      </a>
    )</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
