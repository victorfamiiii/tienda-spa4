<!doctype html>
<html lang="es" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tienda SPA - Ejemplo IA</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="description" content="Tienda virtual de ejemplo — SPA con imágenes y prompts IA" />
</head>
<body>
  <header class="topbar">
    <div class="brand">MiTienda</div>
    <nav class="nav" aria-label="Navegación principal">
      <ul class="nav-list" dir="auto">
        <li><button data-route="home" aria-label="Inicio" title="Inicio" class="icon-btn">🏠</button></li>
        <li><button data-route="map" aria-label="Mapa" title="Mapa" class="icon-btn">🗺️</button></li>
        <li><button data-route="shipping" aria-label="Envío y pago" title="Pago y envío" class="icon-btn">💳🚚</button></li>
        <li><button data-route="contact" aria-label="Contacto" title="Contacto" class="icon-btn">📞</button></li>
        <li><button data-route="cart" aria-label="Ver carrito" title="Carrito" class="icon-btn">🛒<span id="cart-count" class="badge">0</span></button></li>
      </ul>
    </nav>
  </header>

  <main id="app">
    <!-- Contenido renderizado por app.js -->
  </main>

  <footer class="footer">
    <small>MiTienda — Demo SPA · Imágenes: prompts IA (ver 
      <a href="prompts.txt" target="_blank" rel="noopener noreferrer">prompts.txt
        <span class="sr-only">(se abre en una pestaña nueva)</span>
      </a>
    )</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
